<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pack-sort fix — HEX vs PANEL</title>
  <style>
    body { font-family: "Segoe UI", system-ui, sans-serif; background: #12141c; color: #e8e6df; margin: 0; padding: 28px; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    .sub { color: #9a978c; font-size: 13px; margin: 0 0 22px; line-height: 1.45; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .col { flex: 1; min-width: 280px; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #8a8776; margin: 0 0 10px; }
    .card { border: 2px solid #3b82f6; border-radius: 10px; padding: 14px 16px; margin: 10px 0; background: #1a1d28; }
    .card.win { border-color: #1d9e75; box-shadow: 0 0 0 1px #1d9e7540; }
    .card.bad { border-color: #e85d5d; opacity: .95; }
    .num { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center;
      border-radius: 50%; background: #3b82f6; font-weight: 700; margin-right: 10px; }
    .card.win .num { background: #1d9e75; }
    .card.bad .num { background: #e85d5d; }
    .mark { font-weight: 700; font-size: 14px; }
    .meta { color: #a8a59a; font-size: 12px; margin-top: 6px; }
    .pill { display: inline-block; border: 1px solid #3b3f52; border-radius: 999px; padding: 2px 8px; margin: 2px 4px 0 0; font-size: 11px; }
    .pill.ok { border-color: #1d9e7560; color: #1d9e75; }
    .pill.bad { border-color: #e85d5d60; color: #e85d5d; }
    .banner { background: #1d9e7520; border: 1px solid #1d9e7560; color: #8fd9c0; padding: 10px 14px; border-radius: 8px; margin-top: 18px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Your screenshot case — sort fix</h1>
  <p class="sub">HEX rod group total 47 356 kg was ranking #1. Correct key = <b>kg per pack unit</b> (piece/set), so PANEL (~4217) beats HEX (~2960).</p>
  <div class="row">
    <div class="col">
      <h2>Before (wrong — group total)</h2>
      <div id="before"></div>
    </div>
    <div class="col">
      <h2>After (fixed — kg/unit)</h2>
      <div id="after"></div>
    </div>
  </div>
  <div class="banner" id="banner"></div>
  <script>
    function pieceW(g) {
      const mem = g.memberPieces || [];
      let maxU = 0;
      mem.forEach(p => { maxU = Math.max(maxU, +p.unitWeightKg || 0); });
      if (maxU > 0) return maxU;
      return (+g.weightKg || 0) / Math.max(1, +g.qty || 1);
    }
    function packSortKey(g) {
      const cardKg = +g.weightKg || 0;
      const qty = Math.max(1, +g.qty || 1);
      const pus = g.packUnits || [];
      let maxPu = 0;
      pus.forEach(pu => { maxPu = Math.max(maxPu, +pu.total_weight || +pu.weightKg || 0); });
      const inflated = qty > 1 && pus.length > 1 && cardKg > 0 && maxPu >= cardKg * 0.85;
      if (inflated || !maxPu) return pieceW(g);
      return maxPu;
    }
    function render(list, host, mode) {
      host.innerHTML = list.map((g, i) => {
        const unit = Math.round(mode === 'before' ? g.weightKg : packSortKey(g));
        const cls = mode === 'before'
          ? (i === 0 ? 'bad' : 'card')
          : (i === 0 ? 'win' : '');
        const label = mode === 'before'
          ? (i === 0 ? 'WRONG #1 — group total' : '#2')
          : (i === 0 ? 'CORRECT #1 — heavier unit' : '#2');
        return `<div class="card ${cls}">
          <div><span class="num">${i + 1}</span><span class="mark">${g.title}</span></div>
          <div class="meta">${g.name}</div>
          <div class="meta">
            <span class="pill ${mode === 'after' && i === 0 ? 'ok' : ''} ${mode === 'before' && i === 0 ? 'bad' : ''}">${unit} ${mode === 'before' ? 'kg total' : 'kg/unit'}</span>
            <span class="pill">${g.qty} pcs</span>
            <span class="pill">${label}</span>
          </div>
        </div>`;
      }).join('');
    }

    const raw = [
      {
        title: '20×20 · HEX · 16 pcs',
        name: 'ROD_BRACE_ASSY · ROD20',
        weightKg: 47356, qty: 16, groupKind: 'bundle_rod',
        packUnits: Array.from({ length: 16 }, () => ({ total_weight: 47356, qty: 1 })),
        memberPieces: Array.from({ length: 16 }, () => ({ unitWeightKg: 47356 / 16 })),
      },
      {
        title: '200×3000×200 · FLAT · 4 pcs',
        name: 'PANEL · 3000*200',
        weightKg: 16866, qty: 4, groupKind: 'stack_plate',
        packUnits: Array.from({ length: 4 }, () => ({ total_weight: 16866 / 4, qty: 1 })),
        memberPieces: Array.from({ length: 4 }, () => ({ unitWeightKg: 16866 / 4 })),
      },
    ];

    const before = raw.slice().sort((a, b) => b.weightKg - a.weightKg);
    const after = raw.slice().sort((a, b) => packSortKey(b) - packSortKey(a));
    render(before, document.getElementById('before'), 'before');
    render(after, document.getElementById('after'), 'after');
    document.getElementById('banner').textContent =
      'Result: #' + (after[0].title.includes('FLAT') ? '1 PANEL' : '1 HEX')
      + ' (' + Math.round(packSortKey(after[0])) + ' kg/unit) → #'
      + (after[1].title.includes('HEX') ? '2 HEX' : '2 PANEL')
      + ' (' + Math.round(packSortKey(after[1])) + ' kg/unit). SteelViewerApp also restarted with this fix — reload / Group by Shape again.';
  </script>
</body>
</html>
